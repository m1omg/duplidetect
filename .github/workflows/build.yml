name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # egui needs X11/Wayland and GL headers to build on Linux; ALSA is for
      # preview playback. None of this is needed by users at runtime beyond the
      # libraries every desktop already ships.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
                                  libgl1-mesa-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Unit and parity tests
        working-directory: rust
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/tests.txt" || {
            {
              echo "### Test failures on ${{ matrix.os }}"
              echo
              echo '```'
              tail -80 "$RUNNER_TEMP/tests.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also emit the failure as workflow annotations, which are readable
            # through the public API without repository admin rights.
            python - "$RUNNER_TEMP/tests.txt" <<'EOF'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          keep = re.compile(r"(FAILED|panicked at|assertion|left:|right:|^error(\[|:)|^\s+--> )")
          lines = [l.rstrip() for l in text.splitlines() if keep.search(l)]
          seen, out = set(), []
          for l in lines:
              if l not in seen:
                  seen.add(l); out.append(l)
          for l in out[:30]:
              msg = l.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{msg}")
          EOF
            exit 1
          }

      # Proves the algorithm agrees with the macOS reference on this machine,
      # not merely that it compiled.
      - name: Self-test
        working-directory: rust
        run: cargo run --release --bin ddcli -- selftest

      # Uses cargo run so the binary name and extension stay correct on every
      # platform, and so the binary is guaranteed to have been built.
      - name: Scan the fixtures and check the expected groups
        shell: bash
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --bin ddcli -- \
            scan testdata/fixtures --json > actual.json
          python Tools/check_expected.py testdata/golden/scan-fixtures.json actual.json

  # macOS runners are scarce and have sat queued for entire runs. The macOS
  # product is the Swift app, which is built and tested on the developer's own
  # machine, so this job is informational and must never gate packaging.
  test-macos:
    name: test (macos, informational)
    runs-on: macos-13
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Unit and parity tests
        working-directory: rust
        run: cargo test --release --workspace
      - name: Self-test
        working-directory: rust
        run: cargo run --release --bin ddcli -- selftest

  package:
    name: package (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
                                  libgl1-mesa-dev libwayland-dev libxkbcommon-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build release binaries
        working-directory: rust
        run: cargo build --release --bin duplidetect --bin ddcli

      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist/DupliDetect
          cp rust/target/release/duplidetect.exe dist/DupliDetect/DupliDetect.exe
          cp rust/target/release/ddcli.exe       dist/DupliDetect/ddcli.exe
          cp README-windows.txt                  dist/DupliDetect/README.txt

      - name: Stage Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/DupliDetect
          cp rust/target/release/duplidetect dist/DupliDetect/DupliDetect
          cp rust/target/release/ddcli       dist/DupliDetect/ddcli
          cp README-linux.txt                dist/DupliDetect/README.txt
          cp packaging/DupliDetect.desktop   dist/DupliDetect/
          chmod +x dist/DupliDetect/DupliDetect dist/DupliDetect/ddcli
          echo "--- runtime library dependencies ---"
          ldd dist/DupliDetect/DupliDetect || true

      - uses: actions/upload-artifact@v4
        with:
          name: DupliDetect-${{ matrix.target }}
          path: dist/DupliDetect
